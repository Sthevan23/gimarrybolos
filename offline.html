<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gimarry Bolos — temporariamente off</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #fff1f4, #fffaf8 45%, #fceef3);
      color: #3d2610;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0;
      max-width: 28rem;
      line-height: 1.55;
      color: #7a5638;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
    }
    .brand {
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      color: #e85a76;
      margin-bottom: 1rem;
      line-height: 1;
      font-family: Georgia, cursive;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Gimarry Bolos</div>
    <h1>Site temporariamente desligado</h1>
    <p>Estamos pausados para economizar recursos da hospedagem. Em breve voltamos.</p>
  </main>
</body>
</html>
